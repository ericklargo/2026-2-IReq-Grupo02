<script>
/* Catálogo de reglas y parámetros (Apéndice E · CR-01, SRS-OIKOS-001 LB-0.8) */
const PLAZ={"PQRS general":5,"Reclamo sobre un recibo":2},VIGH="2027-01-31",RECARGO_FIJO=15000,TOTAL_UNIDADES=180;
const FEST={"2026-11-02":"Todos los Santos","2026-11-16":"Independencia de Cartagena","2026-12-08":"Inmaculada Concepción","2026-12-25":"Navidad","2027-01-01":"Año Nuevo","2027-01-11":"Reyes Magos"};
const NORM={N1:v=>v.trim().replace(/[ \t]+/g," "),N2:v=>v.trim().toLowerCase(),N3:v=>v.toUpperCase().replace(/\s/g,""),N4:v=>v.replace(/[\s$.]/g,"")};
const obl=m=>({id:"R1",t:"obl",m,inv:[""]});

/* Unidades representativas (180 unidades totales: 167 propietarios + 13 constructora · D4) */
const UNIDADES=[
  {u:"102",pagador:"Propietario",nombre:"Carlos Méndez",coef:0.5096},
  {u:"210",pagador:"Propietario",nombre:"Ana María Ruiz",coef:0.5385},
  {u:"401",pagador:"Propietario",nombre:"Jorge E. Torres",coef:0.5385},
  {u:"603",pagador:"Propietario",nombre:"Laura P. Gómez",coef:0.5962},
  {u:"901",pagador:"Constructora",nombre:"Constructora Oikos (U1)",coef:0.5962},
  {u:"902",pagador:"Constructora",nombre:"Constructora Oikos (U2)",coef:0.5962},
  {u:"903",pagador:"Constructora",nombre:"Constructora Oikos (U3)",coef:0.5962}
];
const UNIDADES_CONS=["901","902","903"];

/* Definición declarativa de campos: P-01 y P-04 */
const P01=[
  {id:"unidad",e:"Unidad (apartamento)",k:"text",a:"Tres dígitos (101–913). Constructora: 901–913 (D2, RF-007.1).",n:["N1"],rol:["adm","cons"],r:[obl("Ingrese el número de la unidad."),{id:"R2",t:"pat",p:"^[1-9]\\d{2}$",m:"La unidad debe tener 3 dígitos, por ejemplo 603.",inv:["60","0603","6o3"]}],v:["603","401"],nm:[[" 603 ","603"]]},
  {id:"canal",e:"Canal por el que llegó la solicitud",k:"sel",op:["WhatsApp","Correo","Portería"],a:"Registro asistido a nombre del residente (D2 · RF-007.1).",rol:["adm"],r:[obl("Elija el canal de origen.")],v:["WhatsApp"]},
  {id:"cat",e:"Categoría",k:"sel",op:Object.keys(PLAZ),r:[obl("Elija la categoría.")],v:["PQRS general"]},
  {id:"periodo",e:"Periodo reclamado (AAAA-MM)",k:"text",a:"Por ejemplo 2026-10.",n:["N1"],si:["cat","Reclamo sobre un recibo"],r:[obl("Indique el periodo del recibo reclamado."),{id:"R2",t:"pat",p:"^\\d{4}-(0[1-9]|1[0-2])$",m:"Escriba el periodo como AAAA-MM, por ejemplo 2026-10.",inv:["2026-13","26-10","octubre"]}],v:["2026-10"]},
  {id:"desc",e:"Descripción",k:"area",a:"Entre 10 y 500 caracteres.",n:["N1"],r:[obl("Ingrese la descripción."),{id:"R2",t:"lon",min:10,max:500,m:"La descripción debe tener entre 10 y 500 caracteres (tiene {n}).",inv:["corta","x".repeat(501)]}],v:["El ascensor de la torre hace ruido desde el lunes."],nm:[["  Hola   mundo  ","Hola mundo"]]},
  {id:"correo",e:"Correo para la confirmación",k:"text",a:"Allí llega el radicado único (RF-001.2).",n:["N2"],r:[obl("Ingrese su correo electrónico."),{id:"R2",t:"pat",p:"^[a-z0-9._%+\\-]+@[a-z0-9\\-]+(?:\\.[a-z0-9\\-]+)*\\.[a-z]{2,}$",m:"El correo electrónico no es válido.",inv:["a@b","juan.perez","juan@correo"]}],v:["liliana@oikos.co"],nm:[["  JUAN@Correo.COM ","juan@correo.com"]]}
];

const P04=[
  {id:"recibo",e:"Recibo con saldo",k:"sel",op:"rec",r:[obl("Elija el recibo al que se aplica el pago.")],v:["RC-2026-11-401"]},
  {id:"referencia",e:"Referencia bancaria única",k:"text",a:"De 6 a 20 caracteres: letras, números o guion. Debe ser única (GLO-09, RN-09, RF-031.1).",n:["N3"],r:[obl("Ingrese la referencia bancaria."),{id:"R2",t:"pat",p:"^[A-Z0-9-]{6,20}$",m:"La referencia debe tener de 6 a 20 caracteres: letras, números o guion.",inv:["ab","TRX#8839201"]},{id:"R3",t:"uni",m:"La referencia bancaria ya está registrada: pago {o} (RN-09)."}],v:["TRX-7710022"],nm:[[" trx-883 9201 ","TRX-8839201"]]},
  {id:"valor",e:"Valor pagado (COP)",k:"text",a:"Entero mayor que cero. Se imputa primero al recargo y luego a la cuota (RF-031.2).",n:["N4"],r:[obl("Ingrese el valor pagado."),{id:"R2",t:"pat",p:"^[1-9]\\d{0,8}$",m:"El valor debe ser un número entero mayor que cero.",inv:["0","-5","12,5","abc"]},{id:"R3",t:"max",m:"El valor supera el saldo del recibo ({s})."}],v:["280000"],nm:[["$ 295.000","295000"]]},
  {id:"fecha",e:"Fecha del pago",k:"date",r:[obl("Ingrese la fecha del pago."),{id:"R2",t:"fut",m:"La fecha del pago no puede ser posterior a hoy ({h}).",inv:["2026-11-24"]}],v:["2026-11-23","2026-11-20"]},
  {id:"medio",e:"Medio de pago",k:"sel",op:["Transferencia","Consignación","Efectivo"],r:[obl("Elija el medio de pago.")],v:["Transferencia"]},
  {id:"soporte",e:"Soporte del pago",k:"file",a:"PDF, JPG, JPEG o PNG.",n:["N2"],r:[obl("Adjunte el soporte del pago."),{id:"R2",t:"pat",p:"^.+\\.(pdf|jpe?g|png)$",m:"El soporte debe ser un archivo PDF, JPG o PNG.",inv:["foto.heic","soporte"]}],v:["comprobante.pdf","Foto.JPEG"]}
];

/* Calendario en UTC (GLO-16 · Día hábil) */
const sd=(i,n)=>new Date(Date.parse(i+"T00:00:00Z")+n*864e5).toISOString().slice(0,10),dw=i=>new Date(i+"T00:00:00Z").getUTCDay(),habil=i=>dw(i)%6!==0&&!FEST[i];
function lim(rad,n){let x=rad,f=[];for(let k=0;k<n;k++){let y=sd(x,1);while(!habil(y)){if(FEST[y])f.push(y);y=sd(y,1)}x=y}return x>VIGH||rad>VIGH?{fuera:true,f}:{fecha:x,f}}
const DS=["dom","lun","mar","mié","jue","vie","sáb"],fF=i=>`${DS[dw(i)]} ${i.slice(8)}/${i.slice(5,7)}/${i.slice(0,4)}`;
const $f=n=>"$"+Number(n).toLocaleString("es-CO");

/* Cálculo dinámico de recargo (RN-06 / RF-021.1): $15.000 si saldo > 0 tras 24:00 del día 10 */
function recEfectivo(q,h){
  const limiteDia10=q.periodo+"-10";
  if(q.pagadoAntes10)return 0;
  return h>limiteDia10?RECARGO_FIJO:0;
}
const saldo=(q,h=hoy())=>Math.max(0,q.cuota+recEfectivo(q,h)-q.ap);
const est=(q,h=hoy())=>saldo(q,h)===0?"Pagado":q.ap>0?"Parcialmente pagado":recEfectivo(q,h)>0?"Con recargo":"Vigente";

/* Estado en memoria (sin localStorage) */
function nuevo(){
  const L1=lim("2026-11-18",5),L2=lim("2026-11-20",2),L3=lim("2026-11-12",5);
  return{
    sol:[
      {id:"PQRS-2026-11-0001",cat:"PQRS general",u:"603",pagador:"Propietario",canal:"Canal único",desc:"Solicitud de revisión de citófono en apartamento 603.",fecha:"2026-11-18T10:15",plazo:5,lim:L1.fecha,fuera:L1.fuera,fest:L1.f,correo:"laura.603@oikos.co",estado:"Radicada"},
      {id:"PQRS-2026-11-0002",cat:"Reclamo sobre un recibo",u:"401",pagador:"Propietario",canal:"WhatsApp",desc:"Consulta sobre aplicación de recargo extemporáneo en periodo 2026-10.",fecha:"2026-11-20T15:40",plazo:2,lim:L2.fecha,fuera:L2.fuera,fest:L2.f,correo:"jorge.401@oikos.co",estado:"En trámite"},
      {id:"PQRS-2026-11-0003",cat:"PQRS general",u:"901",pagador:"Constructora",canal:"Canal único",desc:"Entrega de paz y salvo de unidades pendientes por escriturar.",fecha:"2026-11-12T09:00",plazo:5,lim:L3.fecha,fuera:L3.fuera,fest:L3.f,correo:"cartera@constructora-oikos.co",estado:"Radicada"}
    ],
    cons:{"2026-11":3},
    ult:null,
    msg:"",
    periodoActual:"2026-11",
    presupuesto:52000000,
    sumaCoef:100.00,
    cierres:{"2026-10":true,"2026-11":false},
    acuerdos:[
      {id:"AC-2026-01",u:"102",pagador:"Propietario",total:560000,cuotas:4,valorCuota:140000,pagadas:1,fecha:"2026-11-02",estado:"Vigente"}
    ],
    bit:[
      {t:"2026-11-05 14:20",u:"Contadora",op:"Pago registrado",d:"PG-0001 · RC-2026-11-210 · $295.000 (Ref: TRX-8839201)"}
    ],
    pagos:[
      {id:"PG-0001",recId:"RC-2026-11-210",u:"210",pagador:"Propietario",ref:"TRX-8839201",val:295000,fecha:"2026-11-05",medio:"Transferencia",consolidado:false}
    ],
    rec:[
      {id:"RC-2026-11-401",periodo:"2026-11",u:"401",pagador:"Propietario",cuota:280000,ap:0,pagadoAntes10:false},
      {id:"RC-2026-11-603",periodo:"2026-11",u:"603",pagador:"Propietario",cuota:310000,ap:0,pagadoAntes10:false},
      {id:"RC-2026-11-102",periodo:"2026-11",u:"102",pagador:"Propietario",cuota:265000,ap:0,pagadoAntes10:false},
      {id:"RC-2026-11-210",periodo:"2026-11",u:"210",pagador:"Propietario",cuota:280000,ap:295000,pagadoAntes10:false},
      {id:"RC-2026-11-901",periodo:"2026-11",u:"901",pagador:"Constructora",cuota:310000,ap:0,pagadoAntes10:false},
      {id:"RC-2026-11-902",periodo:"2026-11",u:"902",pagador:"Constructora",cuota:310000,ap:0,pagadoAntes10:false},
      {id:"RC-2026-11-903",periodo:"2026-11",u:"903",pagador:"Constructora",cuota:310000,ap:0,pagadoAntes10:false}
    ]
  };
}

let S=nuevo(),RELOJ="2026-11-23T09:30",ROL="res603";
const hoy=()=>RELOJ.slice(0,10);
const NR={res603:"Residente (Apto. 603)",res401:"Residente (Apto. 401)",cons:"Constructora",adm:"Administradora",cont:"Contadora"};
const esResidente=r=>r==="res603"||r==="res401";
const unidadDeRol=r=>r==="res603"?"603":r==="res401"?"401":null;
const log=(op,d)=>S.bit.unshift({t:RELOJ.replace("T"," "),u:NR[ROL],op,d});

/* Aislamiento de datos por rol (RNF-003.1 · 0 accesos cruzados) */
function filtrarPorRol(lista,rol=ROL){
  if(rol==="adm"||rol==="cont")return lista;
  if(esResidente(rol)){const u=unidadDeRol(rol);return lista.filter(x=>x.u===u)}
  if(rol==="cons")return lista.filter(x=>UNIDADES_CONS.includes(x.u)||x.pagador==="Constructora");
  return[];
}

/* Motor de reglas declarativo */
function ok(r,v,x){
  switch(r.t){
    case"obl":return v!=="";
    case"lon":{const n=[...v].length;return n>=r.min&&n<=r.max}
    case"pat":return new RegExp(r.p).test(v);
    case"fut":return v<=x.hoy;
    case"uni":return!S.pagos.some(p=>p.ref===v);
    case"max":{const q=S.rec.find(y=>y.id===x.vals.recibo);return!q||+v<=saldo(q,x.hoy)}
  }
  return true;
}
function msg(r,v,x){
  const q=S.rec.find(y=>y.id===(x.vals||{}).recibo),o=S.pagos.find(p=>p.ref===v);
  return r.m.replace("{n}",[...v].length).replace("{h}",x.hoy).replace("{s}",q?$f(saldo(q,x.hoy)):"").replace("{o}",o?`${o.id} del ${o.fecha} por ${$f(o.val)}`:"");
}
const norm=(c,v)=>(c.n||[]).reduce((a,n)=>NORM[n](a),v),falla=(c,v,x)=>c.r.find(r=>!(v===""&&r.t!=="obl")&&!ok(r,v,x))||null;
const vis=(c,vals,rol)=>(!c.rol||c.rol.includes(rol))&&(!c.si||vals[c.si[0]]===c.si[1]);

function validar(F,vals,x,rol){
  const e={};x.vals=vals;
  for(const c of F){
    if(!vis(c,vals,rol))continue;
    vals[c.id]=norm(c,vals[c.id]||"");
    const r=falla(c,vals[c.id],x);
    if(r)e[c.id]=msg(r,vals[c.id],x);
  }
  return e;
}

/* Caso de uso P-01: Radicar solicitud (RF-001.1, RF-001.2, RF-007.1, RN-03) */
function radicar(v,rol){
  const e=validar(P01,v,{hoy:hoy()},rol);
  if(Object.keys(e).length)return{e};
  const ym=hoy().slice(0,7),n=(S.cons[ym]||0)+1;S.cons[ym]=n;
  const L=lim(hoy(),PLAZ[v.cat]);
  const uFinal=esResidente(rol)?unidadDeRol(rol):v.unidad;
  const pag=UNIDADES_CONS.includes(uFinal)||rol==="cons"?"Constructora":"Propietario";
  const s={
    id:`PQRS-${ym}-${String(n).padStart(4,"0")}`,
    cat:v.cat,u:uFinal,pagador:pag,
    canal:rol==="adm"?v.canal:"Canal único",
    desc:v.desc,fecha:RELOJ,plazo:PLAZ[v.cat],
    lim:L.fecha,fuera:L.fuera,fest:L.f,correo:v.correo,estado:"Radicada"
  };
  S.sol.unshift(s);S.ult=s;
  log("Solicitud radicada (RF-001.1)",`${s.id} · Apto. ${s.u} (${s.canal})`);
  return{s};
}

/* Caso de uso P-04: Registrar pago individual (RF-031.1, RF-031.2, RN-08, RN-09) */
function pagar(v,h,rol=ROL){
  const e=validar(P04,v,{hoy:h},rol);
  if(Object.keys(e).length){
    log("Pago rechazado (RN-09/Validación)",Object.keys(e).length+" error(es): "+Object.keys(e).join(", "));
    return{e};
  }
  const q=S.rec.find(y=>y.id===v.recibo);
  const valNum=+v.valor;
  if(h<=q.periodo+"-10"&&q.ap+valNum>=q.cuota)q.pagadoAntes10=true;
  q.ap+=valNum;
  const cerrado=!!S.cierres[q.periodo];
  const notaCierre=cerrado?" · Imputado a periodo siguiente por cierre contable (RN-08)":"";
  const p={id:"PG-"+String(S.pagos.length+1).padStart(4,"0"),recId:q.id,u:q.u,pagador:q.pagador,ref:v.referencia,val:valNum,fecha:v.fecha,medio:v.medio,consolidado:false,notaCierre};
  S.pagos.push(p);
  log("Pago registrado (RF-031.1)",`${p.id} · ${q.id} · ${$f(p.val)} · Ref: ${p.ref}${notaCierre}`);
  return{p,q,cerrado};
}

/* Caso de uso P-04b: Pago consolidado Constructora (RF-031.3, RN-09) */
function pagarConsolidado(refRaw,fecha,medio,recIds,h){
  const ref=NORM.N3(refRaw||"");
  const errs=[];
  if(!/^[A-Z0-9-]{6,20}$/.test(ref))errs.push("La referencia debe tener de 6 a 20 caracteres alfanuméricos o guion.");
  if(S.pagos.some(p=>p.ref===ref&&!p.consolidado))errs.push("La referencia ya pertenece a un pago individual y no puede reutilizarse (RN-09).");
  if(!fecha||fecha>h)errs.push(`La fecha no puede ser posterior a hoy (${h}).`);
  if(!recIds.length)errs.push("Seleccione al menos una unidad de la Constructora con saldo pendiente.");
  if(errs.length){
    log("Pago consolidado rechazado",errs.join(" "));
    return{errs};
  }
  let total=0;const aplicados=[];
  for(const rid of recIds){
    const q=S.rec.find(y=>y.id===rid);
    if(!q)continue;
    const sal=saldo(q,h);
    if(sal<=0)continue;
    if(h<=q.periodo+"-10")q.pagadoAntes10=true;
    q.ap+=sal;total+=sal;
    const p={id:"PG-"+String(S.pagos.length+1).padStart(4,"0"),recId:q.id,u:q.u,pagador:"Constructora",ref,val:sal,fecha,medio,consolidado:true};
    S.pagos.push(p);aplicados.push(q.u);
  }
  log("Pago consolidado Constructora (RF-031.3)",`Ref: ${ref} · ${aplicados.length} unidades (${aplicados.join(", ")}) · Total ${$f(total)}`);
  return{ref,total,aplicados};
}

/* Condición SLA en días hábiles (RF-040.1 / D10) */
function cond(s,h){
  if(s.estado==="Respondida")return["Respondida","✔"];
  if(s.fuera)return["Sin calcular","–"];
  if(h>s.lim)return["Vencida","✖"];
  let t=0,d=s.fecha.slice(0,10);
  while(d<h){d=sd(d,1);if(habil(d))t++}
  return t>=Math.ceil(.8*s.plazo)?["Por vencer","▲"]:["En plazo","●"];
}

function campo(c,p){

  else t=`<input id="${id}" name="${c.id}" type="${c.k==="file"?"file":c.k==="date"?"date":"text"}" autocomplete="off" ${d}>`;

const leer=(F,f)=>Object.fromEntries(F.map(c=>{const el=f.elements[c.id];return[c.id,!el?"":c.k==="file"?(el.files[0]?el.files[0].name:""):el.value]}));

$("#"+f.id+"-res").textContent=n?`Hay ${n} campo(s) con errores.`:"";if(p)p.focus();return n}

      S.msg=`✔ Pago ${r.p.id} registrado (${r.p.ref}). Recibo ${r.q.id}: saldo ${$f(saldo(r.q,hoy()))}, estado ${est(r.q,hoy())}.${r.cerrado?" Nota RN-08: Periodo cerrado, movimiento imputado al siguiente periodo abierto.":""}`;
      vP04();$("#main h1").focus();
    }
  });

  const btnCons=$("#fc-btn");
  if(btnCons)btnCons.addEventListener("click",()=>{
    const ids=[...document.querySelectorAll("#fc-uds input:checked")].map(i=>i.value);
    const res=pagarConsolidado($("#fc-ref").value,$("#fc-fec").value,$("#fc-med").value,ids,hoy());
    if(res.errs)$("#fc-err").textContent="✖ "+res.errs.join(" ");
    else{
      S.msg=`✔ Pago consolidado ${res.ref} aplicado a ${res.aplicados.length} unidades de Constructora (${res.aplicados.join(", ")}) por ${$f(res.total)} (RF-031.3).`;
      vP04();$("#main h1").focus();
    }
  });
}

/* P-05: Conciliación, cierre contable y exportación Siigo (RF-037.1, RN-08, RN-12) */
function vP05(){
  const m=$("#main");
  const cerrado=!!S.cierres[S.periodoActual];
  const totEmitido=S.rec.reduce((a,q)=>a+q.cuota+recEfectivo(q,hoy()),0);
  const totRecaudado=S.pagos.reduce((a,p)=>a+p.val,0);
  const totPendiente=S.rec.reduce((a,q)=>a+saldo(q,hoy()),0);

  m.innerHTML=`<h1 tabindex="-1">P-05 · Conciliación y exportación Siigo</h1>
  <p>Concilia los pagos aprobados contra los recibos emitidos, ejecuta el cierre contable mensual (RN-08) y exporta el archivo de intercambio compatible con <strong>Siigo</strong> sin conexión API directa (RF-037.1 / RN-12).</p>
  <div class="grid">
    <div class="card"><p class="k">Total facturado (${S.periodoActual})</p><p class="v">${$f(totEmitido)}</p></div>
    <div class="card"><p class="k">Recaudos conciliados (${S.pagos.length})</p><p class="v ok">${$f(totRecaudado)}</p></div>
    <div class="card"><p class="k">Cartera pendiente</p><p class="v ${totPendiente>0?"av":"ok"}">${$f(totPendiente)}</p></div>
    <div class="card"><p class="k">Estado periodo ${S.periodoActual}</p><p class="v ${cerrado?"res":"ok"}">${cerrado?"CERRADO (RN-08)":"ABIERTO"}</p></div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:.6rem;margin:.8rem 0">
    <button type="button" id="p5-csv">⬇ Descargar CSV compatible con Siigo (RF-037.1)</button>
    <button type="button" class="s" id="p5-cerrar" ${cerrado?"disabled":""}>${cerrado?"Periodo ya cerrado":"Ejecutar cierre contable mensual (RN-08)"}</button>
  </div>
  <div id="p5-msg" role="status"></div>
  <h2>Vista previa del archivo de intercambio Siigo (${S.pagos.length} movimientos aprobados)</h2>
  ${tabla(["ID Pago","Fecha","Unidad","Pagador","Referencia bancaria","Medio","Valor (COP)","Tipo"],S.pagos.map(p=>`<tr><td>${p.id}</td><td>${p.fecha}</td><td>Apto. ${p.u}</td><td>${p.pagador}</td><td><code>${p.ref}</code></td><td>${p.medio}</td><td>${$f(p.val)}</td><td>${p.consolidado?"Consolidado (RF-031.3)":"Individual"}</td></tr>`).join(""))}`;

  $("#p5-cerrar").addEventListener("click",()=>{
    S.cierres[S.periodoActual]=true;
    log("Cierre contable ejecutado (RN-08)",`Periodo ${S.periodoActual} cerrado · Recaudado ${$f(totRecaudado)} · Pendiente ${$f(totPendiente)}`);
    vP05();
    $("#p5-msg").innerHTML=`<p class="ok">✔ Cierre contable del periodo ${S.periodoActual} registrado en bitácora (RN-08). Todo pago posterior se imputará al siguiente periodo abierto.</p>`;
  });

  $("#p5-csv").addEventListener("click",()=>{
    const enc=["Comprobante_Siigo","Fecha","Cuenta_Contable","NIT_Pagador","Unidad","Referencia_Bancaria","Medio_Pago","Descripcion","Debito_Banco","Credito_Cartera"];
    const lineas=S.pagos.map(p=>{
      const nit=p.pagador==="Constructora"?"900812345-1":`1049600${p.u}`;
      return["RC-OIKOS",p.fecha,"11100501",nit,`APTO-${p.u}`,p.ref,p.medio,`Recaudo cuota admon ${S.periodoActual} Apto ${p.u}`,p.val,p.val].join(";");
    });
    const csv="\uFEFF"+[enc.join(";"),...lineas].join("\r\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=`Siigo_Recaudos_Oikos_${S.periodoActual}.csv`;a.click();
    URL.revokeObjectURL(url);
    log("Exportación Siigo generada (RF-037.1)",`Archivo Siigo_Recaudos_Oikos_${S.periodoActual}.csv (${S.pagos.length} registros)`);
    $("#p5-msg").innerHTML=`<p class="ok">✔ Archivo <strong>Siigo_Recaudos_Oikos_${S.periodoActual}.csv</strong> descargado y registrado en bitácora (RF-037.1 / RN-12).</p>`;
  });
}

/* P-06: Control de plazos SLA y semáforo de alertas (RF-040.1, D10, GLO-16) */
function vP06(){
  const m=$("#main");
  const activas=S.sol.filter(s=>s.estado!=="Respondida");
  let enPlazo=0,porVencer=0,vencidas=0;
  for(const s of activas){const c=cond(s,hoy())[0];if(c==="Vencida")vencidas++;else if(c==="Por vencer")porVencer++;else enPlazo++}
  m.innerHTML=`<h1 tabindex="-1">P-06 · Plazos SLA y alertas (Días hábiles)</h1>
  <p>Vigila el vencimiento de solicitudes calculado en <strong>días hábiles</strong> (lunes a viernes sin festivos parametrizados · GLO-16 / RF-040.1) respecto al reloj simulado (<strong>${fF(hoy())}</strong>).</p>
  <div class="grid">
    <div class="card"><p class="k">● En plazo (&lt; 80 % tiempo)</p><p class="v ok">${enPlazo}</p></div>
    <div class="card"><p class="k">▲ Por vencer (&ge; 80 % tiempo)</p><p class="v av">${porVencer}</p></div>
    <div class="card"><p class="k">✖ Vencidas</p><p class="v res">${vencidas}</p></div>
  </div>
  ${tabla(["Semáforo","Radicado","Unidad","Categoría","Radicada el","Límite SLA","Días hábiles","Estado"],S.sol.map(s=>{
    const c=cond(s,hoy()),cl=c[0]==="Vencida"?"res":c[0]==="Por vencer"?"av":"ok";
    return`<tr><td class="${cl}">${c[1]} ${c[0]}</td><td><strong>${s.id}</strong></td><td>Apto. ${s.u}</td><td>${esc(s.cat)}</td><td>${fF(s.fecha.slice(0,10))}</td><td>${s.fuera?"Sin calcular":fF(s.lim)}</td><td>${s.plazo} d.h.</td><td>${s.estado}</td></tr>`;
  }).join(""))}
  <p class="nota">Pruebe cambiar el «Reloj simulado» arriba a fechas posteriores (ej. 05/12/2026 o 24/12/2026) para observar la transición automática del semáforo SLA.</p>`;
}

/* P-07: Cartera histórica y acuerdos de pago hasta 4 meses (D11, D12, RNF-003.1) */
function vP07(){
  const m=$("#main");
  const recs=filtrarPorRol(S.rec,ROL);
  const acuerdos=filtrarPorRol(S.acuerdos,ROL);
  const unidadesDisp=ROL==="adm"?UNIDADES.map(x=>x.u):ROL==="cons"?UNIDADES_CONS:[unidadDeRol(ROL)];
  const deudaTotal=recs.reduce((a,q)=>a+saldo(q,hoy()),0);

  m.innerHTML=`<h1 tabindex="-1">P-07 · Cartera y acuerdos de pago</h1>
  <p>Consulta el estado de cuenta histórico por unidad privada (D11) y gestiona acuerdos de pago diferidos a <strong>máximo 4 meses</strong> (D12). ${ROL!=="adm"?"Aislamiento por rol activo (RNF-003.1).":""}</p>
  <div class="grid">
    <div class="card"><p class="k">Saldo total cartera visible</p><p class="v ${deudaTotal>0?"av":"ok"}">${$f(deudaTotal)}</p></div>
    <div class="card"><p class="k">Acuerdos de pago activos</p><p class="v">${acuerdos.length}</p></div>
  </div>
  <h2>Estado de cuenta por unidad (D11)</h2>
  ${tabla(["Recibo","Unidad","Pagador","Cuota","Recargo (RN-06)","Abonado","Saldo actual","Estado"],recs.map(q=>`<tr><td>${q.id}</td><td>Apto. ${q.u}</td><td>${q.pagador}</td><td>${$f(q.cuota)}</td><td>${$f(recEfectivo(q,hoy()))}</td><td>${$f(q.ap)}</td><td><strong>${$f(saldo(q,hoy()))}</strong></td><td>${est(q,hoy())}</td></tr>`).join(""))}
  <h2>Acuerdos de pago (Máximo 4 cuotas mensuales · D12)</h2>
  <div class="card">
    <p class="res" id="ac-err" role="alert"></p>
    <p class="ok" id="ac-ok" role="status"></p>
    <div class="filt" style="margin:.3rem 0">
      <label>Unidad<select id="ac-u">${unidadesDisp.map(u=>`<option value="${u}">Apto. ${u}</option>`).join("")}</select></label>
      <label>Monto a diferir (COP)<input id="ac-val" type="number" value="325000" step="5000"></label>
      <label>Plazo en meses (1 a 4)<input id="ac-mes" type="number" value="3" min="1" max="12"></label>
    </div>
    <button type="button" id="ac-btn">Registrar acuerdo de pago (D12)</button>
  </div>
  ${acuerdos.length?tabla(["ID Acuerdo","Unidad","Monto diferido","Plazo","Cuota mensual","Progreso","Estado"],acuerdos.map(a=>`<tr><td><strong>${a.id}</strong></td><td>Apto. ${a.u}</td><td>${$f(a.total)}</td><td>${a.cuotas} meses</td><td>${$f(a.valorCuota)}</td><td>${a.pagadas} / ${a.cuotas}</td><td><span class="badge">${a.estado}</span></td></tr>`).join("")):'<p class="nota">No hay acuerdos de pago registrados para las unidades visibles.</p>'}`;

  $("#ac-btn").addEventListener("click",()=>{
    const u=$("#ac-u").value,val=Number($("#ac-val").value),mes=Number($("#ac-mes").value);
    $("#ac-err").textContent="";$("#ac-ok").textContent="";
    if(val<=0){$("#ac-err").textContent="✖ El monto a diferir debe ser mayor a $0 COP.";return}
    if(!Number.isInteger(mes)||mes<1||mes>4){
      $("#ac-err").textContent="✖ Regla D12: El plazo del acuerdo de pago no puede superar los 4 meses (ingresó "+mes+").";
      return;
    }
    const pag=UNIDADES_CONS.includes(u)?"Constructora":"Propietario";
    const ac={id:`AC-2026-${String(S.acuerdos.length+1).padStart(2,"0")}`,u,pagador:pag,total:val,cuotas:mes,valorCuota:Math.round(val/mes),pagadas:0,fecha:hoy(),estado:"Vigente"};
    S.acuerdos.unshift(ac);
    log("Acuerdo de pago registrado (D12)",`${ac.id} · Apto. ${u} · ${$f(val)} en ${mes} cuotas de ${$f(ac.valorCuota)}`);
    vP07();
    $("#ac-ok").textContent=`✔ Acuerdo ${ac.id} creado para Apto. ${u}: ${mes} cuotas mensuales de ${$f(ac.valorCuota)}.`;
  });
}

/* Bitácora inalterable (RNF-004.1) */
function vBit(){
  $("#main").innerHTML=`<h1 tabindex="-1">Bitácora de auditoría (RNF-004.1)</h1>
  <p>Registro cronológico inalterable del 100 % de aprobaciones de liquidación, registros de pago, rechazos por duplicidad y cierres contables. Ningún rol posee funciones de edición o borrado.</p>
  ${S.bit.length?tabla(["Fecha y hora","Rol ejecutor","Operación","Detalle"],S.bit.map(b=>`<tr><td>${b.t}</td><td>${esc(b.u)}</td><td><strong>${esc(b.op)}</strong></td><td>${esc(b.d)}</td></tr>`).join("")):"<p>Aún no hay operaciones registradas.</p>"}`;
}

/* Autoprueba de reglas y casos de aceptación */
function vAuto(){
  const R=auto(),n=R.filter(r=>r[4]).length;
  $("#main").innerHTML=`<h1 tabindex="-1">Autoprueba de reglas y criterios de aceptación</h1>
  <p class="${n===R.length?"ok":"res"}" role="status">${n===R.length?"✔":"✖"} ${n} de ${R.length} comprobaciones aprobadas (SRS-OIKOS-001 LB-0.8).</p>
  <p>Verifica validaciones de campos, días hábiles con festivos, recargo dinámico tras día 10 (RN-06), control anti-duplicados y pago consolidado Constructora (RN-09 / RF-031.3), consecutivos PQRS (RN-03) y aislamiento por unidad (RNF-003.1).</p>
  ${tabla(["Módulo / Regla","Caso de prueba","Esperado","Obtenido",""],R.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td class="${r[4]?"ok":"res"}">${r[4]?"✔":"✖"}</td></tr>`).join(""))}`;
}

const V={p01:vP01,p02:vP02,p03:vP03,p04:vP04,p05:vP05,p06:vP06,p07:vP07,bitacora:vBit,autoprueba:vAuto};

function route(){
  const permitidas=NAV.filter(n=>n[2].includes(ROL));
  const h=location.hash.slice(1);
  const it=permitidas.find(n=>n[0]===h)||permitidas[0];
  $("#nav").innerHTML=permitidas.map(n=>`<a href="#${n[0]}"${n[0]===it[0]?' aria-current="page"':""}>${n[1]}</a>`).join("");
  V[it[0]]();
  const h1=$("#main h1");if(h1)h1.focus();
}

$("#rol").addEventListener("change",e=>{ROL=e.target.value;route()});
$("#reloj").addEventListener("change",e=>{if(!e.target.value)return;RELOJ=e.target.value;route()});
$("#caso").addEventListener("change",e=>{if(!e.target.value)return;RELOJ=e.target.value;$("#reloj").value=RELOJ;e.target.value="";route()});
addEventListener("hashchange",route);
route();
}
</script></body></html>
